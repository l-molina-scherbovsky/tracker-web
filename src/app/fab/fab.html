<div class="fab-container">
  @if (open) {
    <div class="fab-menu">
      <button class="fab-option" (click)="onRegistrarVisita()">
        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
        Registrar visita
      </button>
      <button class="fab-option" (click)="goNuevoPaciente()">
        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
        </svg>
        Nuevo paciente
      </button>
      <button class="fab-option" (click)="goNuevoProtocolo()">
        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        Nuevo protocolo
      </button>
    </div>
  }
  <button class="fab-btn" (click)="toggle($event)">
    <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"
         [style.transform]="open ? 'rotate(45deg)' : 'none'"
         style="transition:transform 0.2s">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16M4 12h16"/>
    </svg>
  </button>
</div>
