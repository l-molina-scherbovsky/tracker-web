<div class="app-layout">

  <!-- Sidebar fijo -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <p class="sidebar-logo-name">Fundación<br>Scherbovsky</p>
      <p class="sidebar-logo-sub">Seguimiento clínico</p>
    </div>
    <nav class="sidebar-nav">
      <a routerLink="/"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{exact: true}"
         class="sidebar-nav-item">
        <svg class="sidebar-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        Dashboard
      </a>

      <a routerLink="/protocolos"
         routerLinkActive="active"
         class="sidebar-nav-item">
        <svg class="sidebar-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        Protocolos
      </a>

      <!-- Sub-ítems de protocolos -->
      @for (p of protocols; track p.id) {
        <a [routerLink]="['/protocol', p.id]"
           routerLinkActive="active"
           class="sidebar-sub-item">
          {{ p.id }}
        </a>
      }
      @if (protocols.length > 0) {
        <a routerLink="/protocolos" class="sidebar-sub-item sidebar-sub-ver-todos">Ver todos →</a>
      }

      <a routerLink="/mis-pacientes"
         routerLinkActive="active"
         class="sidebar-nav-item">
        <svg class="sidebar-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        Mis pacientes
      </a>

      <a routerLink="/plantillas"
         routerLinkActive="active"
         class="sidebar-nav-item">
        <svg class="sidebar-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
        </svg>
        Plantillas
      </a>

      <span class="sidebar-nav-item disabled">
        <svg class="sidebar-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
        Agenda semanal
      </span>
    </nav>
  </aside>

  <!-- Contenido principal -->
  <div class="app-content">
    <header class="top-bar">
      <span class="top-bar-user">Ana Torres</span>
    </header>
    <div class="page-body">
      <router-outlet />
    </div>
  </div>

</div>

<!-- FAB -->
<app-fab (registrarVisita)="showRegistroPanel.set(true)" />

<!-- Panel de registro de visita -->
<app-registro-visita-panel
  [visible]="showRegistroPanel()"
  (closed)="showRegistroPanel.set(false)" />
